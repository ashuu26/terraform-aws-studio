<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terraform AWS Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>:root {
  --bg: #EDF1F4; --panel: #FFFFFF; --panel-2: #F6F8FA; --ink: #16212B; --muted: #5A6875; --line: #D3DBE2; --line-2: #E4E9EE;
  --plan: #5B3FD1; --plan-ink: #FFFFFF; --plan-soft: #EEEAFD;
  --net: #2F6FB0; --cmp: #B8790A; --db: #2F7D55; --sto: #A2455E; --root: #5A6875;
  --ok: #2F7D55; --warn: #B8790A; --err: #C0392B; --info: #2F6FB0;
  --grid: rgba(47, 111, 176, .08);
  --code-bg: #FBFCFD; --gutter: #F1F4F7;
  --t-k: #5B3FD1; --t-s: #2F7D55; --t-n: #B8790A; --t-c: #7C8894; --t-a: #16212B; --t-r: #2F6FB0; --t-f: #A2455E; --t-b: #5B3FD1; --t-m: #A2455E;
  --shadow: 0 1px 2px rgba(22, 33, 43, .06), 0 4px 16px rgba(22, 33, 43, .06);
  --radius: 10px;
  --sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F161E; --panel: #16202A; --panel-2: #1B2733; --ink: #E4EAF0; --muted: #93A1AE; --line: #26333F; --line-2: #1F2B36;
    --plan: #9B85FF; --plan-ink: #0F161E; --plan-soft: #241F42;
    --net: #6FA8E0; --cmp: #E0A93B; --db: #5FBF8A; --sto: #E07A95; --root: #93A1AE;
    --ok: #5FBF8A; --warn: #E0A93B; --err: #F07A6C; --info: #6FA8E0;
    --grid: rgba(111, 168, 224, .07); --code-bg: #121B24; --gutter: #16212C;
    --t-k: #B5A4FF; --t-s: #8BD3A8; --t-n: #F0C06A; --t-c: #6E7D8B; --t-a: #D9E1E8; --t-r: #8CBDEB; --t-f: #F09BB0; --t-b: #B5A4FF; --t-m: #F09BB0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F161E; --panel: #16202A; --panel-2: #1B2733; --ink: #E4EAF0; --muted: #93A1AE; --line: #26333F; --line-2: #1F2B36;
  --plan: #9B85FF; --plan-ink: #0F161E; --plan-soft: #241F42;
  --net: #6FA8E0; --cmp: #E0A93B; --db: #5FBF8A; --sto: #E07A95; --root: #93A1AE;
  --ok: #5FBF8A; --warn: #E0A93B; --err: #F07A6C; --info: #6FA8E0;
  --grid: rgba(111, 168, 224, .07); --code-bg: #121B24; --gutter: #16212C;
  --t-k: #B5A4FF; --t-s: #8BD3A8; --t-n: #F0C06A; --t-c: #6E7D8B; --t-a: #D9E1E8; --t-r: #8CBDEB; --t-f: #F09BB0; --t-b: #B5A4FF; --t-m: #F09BB0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--plan); text-underline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: .86em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--plan); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- buttons & inputs ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 14px; line-height: 1.3; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--plan); border-color: var(--plan); color: var(--plan-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--panel-2); }
.btn.sm { padding: 3px 9px; font-size: 13px; }
.btn.danger { color: var(--err); }
.btn[aria-pressed="true"] { background: var(--plan-soft); border-color: var(--plan); color: var(--plan); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; flex: none; }
.field { display: grid; gap: 4px; align-content: start; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); }
.inp, select.inp { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; font-size: 14px; min-width: 0; width: 100%; }
.inp:focus { outline: 2px solid var(--plan); outline-offset: 0; border-color: transparent; }
.chk { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.chk input { accent-color: var(--plan); width: 16px; height: 16px; margin: 0; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1600px; margin: 0 auto; padding: 12px 20px 0; }
.brand-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.logo { width: 38px; height: 38px; flex: none; }
.brand h1 { font-size: 19px; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
.brand p { margin: 0; font-size: 13px; color: var(--muted); }
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.ctl select { width: auto; padding: 5px 8px; font-size: 13px; }
.search { position: relative; }
.search input { width: 240px; padding-left: 32px; padding-right: 30px; }
.search svg { position: absolute; left: 10px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; color: var(--muted); pointer-events: none; }
.search kbd { position: absolute; right: 8px; top: 50%; translate: 0 -50%; font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.tabs { display: flex; gap: 2px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 9px 14px 11px; cursor: pointer; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--plan); font-weight: 600; }
.tab .count { font: 11px var(--mono); background: var(--plan-soft); color: var(--plan); border-radius: 999px; padding: 1px 7px; margin-left: 6px; }
.stale-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-left: 6px; vertical-align: middle; }

/* ---------- layout ---------- */
.layout { max-width: 1600px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.summary { position: sticky; top: 132px; max-height: calc(100vh - 150px); overflow: auto; padding: 16px; display: grid; gap: 16px; }
.summary h2 { font-size: 15px; margin: 0; }
.sec-title { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--muted); }
.stat-big { display: flex; align-items: baseline; gap: 8px; }
.stat-big b { font-size: 34px; line-height: 1; font-weight: 600; letter-spacing: -.02em; }
.stat-big span { color: var(--muted); font-size: 14px; }
.catbars { display: grid; gap: 6px; }
.catbar { display: grid; grid-template-columns: 92px 1fr 24px; align-items: center; gap: 8px; font-size: 13px; }
.catbar .track { height: 6px; background: var(--line-2); border-radius: 3px; overflow: hidden; }
.catbar .fill { height: 100%; border-radius: 3px; transition: width .25s; }
.catbar .n { text-align: right; font-family: var(--mono); font-size: 12px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; text-align: right; }
.foundation { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.foundation li { display: flex; align-items: center; gap: 8px; }
.mark { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
.mark.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.mark.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.mark.error { background: color-mix(in srgb, var(--err) 16%, transparent); color: var(--err); }
.mark.info { background: color-mix(in srgb, var(--info) 16%, transparent); color: var(--info); }
.mark.off { border: 1px dashed var(--line); color: var(--muted); }
.sel-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; max-height: 240px; overflow: auto; }
.sel-list li { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 0; font-size: 14px; border-radius: 6px; }
.sel-list li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.icon-btn { border: 0; background: none; padding: 4px; border-radius: 6px; cursor: pointer; color: var(--muted); display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--panel-2); color: var(--ink); }
.icon-btn svg { width: 15px; height: 15px; }
.recs { border: 1px solid color-mix(in srgb, var(--plan) 40%, var(--line)); background: var(--plan-soft); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
.recs ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.recs .why { font-size: 12.5px; color: var(--muted); margin-left: 24px; }
.actions { display: grid; gap: 8px; }
.actions .btn { justify-content: center; }

/* ---------- services view ---------- */
.svc-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; align-items: start; }
.filters { position: sticky; top: 132px; padding: 16px; display: grid; gap: 18px; }
.filters fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 6px; }
.filters legend { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; padding: 0; }
.filters .chk .n { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
.presets { display: grid; gap: 4px; }
.preset { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 13.5px; }
.preset:hover { border-color: var(--plan); }
.preset small { display: block; color: var(--muted); font-size: 12px; }
.results-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.results-bar h2 { font-size: 15px; margin: 0; }
.results-bar .muted { color: var(--muted); font-size: 14px; }
.cat-group { margin-bottom: 24px; }
.cat-head { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
.cat-head h3 { font-size: 15px; margin: 0; }
.cat-head .rule { flex: 1; height: 1px; background: var(--line); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; position: relative; transition: border-color .15s, box-shadow .15s; }
.card:hover { box-shadow: var(--shadow); }
.card.selected { border-color: var(--plan); box-shadow: 0 0 0 1px var(--plan); }
.card-top { display: flex; gap: 10px; align-items: flex-start; }
.glyph { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; flex: none; color: #fff; font: 700 10.5px/1 var(--mono); letter-spacing: -.02em; position: relative; }
.glyph svg { width: 22px; height: 22px; }
.card h4 { margin: 0; font-size: 15.5px; line-height: 1.25; }
.card .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.pill { font-size: 11.5px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.cat { border-color: transparent; color: #fff; }
.pill.Beginner { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.pill.Intermediate { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.pill.Advanced { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, transparent); }
.res { font: 12.5px var(--mono); color: var(--ink); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .more { color: var(--muted); }
.card p.desc { margin: 0; font-size: 13.5px; color: var(--muted); flex: 1; }
.card .deps { font-size: 12.5px; color: var(--muted); }
.card .deps b { font-weight: 600; color: var(--ink); }
.card-actions { display: flex; gap: 4px; align-items: center; }
.btn.select { border-color: var(--plan); color: var(--plan); font-weight: 600; }
.btn.select:hover { background: var(--plan-soft); }
.card-actions .spacer { flex: 1; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty h3 { color: var(--ink); margin: 0 0 6px; font-size: 16px; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 22, .42); z-index: 50; opacity: 0; transition: opacity .2s; }
.scrim.open { opacity: 1; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--panel); z-index: 51; box-shadow: -8px 0 32px rgba(0, 0, 0, .2); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .22s ease; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { margin: 0; font-size: 18px; }
.drawer-head p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.drawer-head .icon-btn { margin-left: auto; }
.drawer-body { overflow: auto; padding: 18px 20px 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-content: start; flex: 1; }
.drawer-foot { border-top: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.form-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 16px; align-items: start; }
.form-grid .wide { grid-column: 1 / -1; }
.box { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.box h3 { margin: 0 0 8px; font-size: 14px; }
.box ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
.box.note { background: var(--panel-2); }
.links { list-style: none; padding: 0 !important; display: grid; gap: 6px; }
.links a { font-family: var(--mono); font-size: 13px; }
.source-tag { font-size: 11.5px; font-weight: 600; border-radius: 4px; padding: 1px 6px; margin-right: 6px; }
.source-tag.reg { background: color-mix(in srgb, var(--net) 15%, transparent); color: var(--net); }
.source-tag.gen { background: var(--plan-soft); color: var(--plan); }
.source-tag.asm { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.source-tag.mod { background: color-mix(in srgb, var(--db) 15%, transparent); color: var(--db); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 12.5px var(--mono); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 8px; }
.concepts { display: grid; gap: 8px; }
.concept { display: grid; grid-template-columns: 96px 1fr; gap: 10px; font-size: 13.5px; align-items: baseline; }
.concept dt { font-weight: 600; }
.concept dd { margin: 0; color: var(--muted); }
.concept dd code { color: var(--ink); }

/* ---------- code ---------- */
.code { font: 13px/20px var(--mono); tab-size: 2; }
pre.snippet { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow: auto; font: 12.5px/19px var(--mono); max-height: 420px; }
.t-k { color: var(--t-k); font-weight: 600; } .t-b { color: var(--t-b); font-weight: 600; } .t-s { color: var(--t-s); } .t-i { color: var(--t-r); } .t-n { color: var(--t-n); }
.t-c { color: var(--t-c); font-style: italic; } .t-a { color: var(--t-a); } .t-r { color: var(--t-r); } .t-f { color: var(--t-f); } .t-m { color: var(--t-m); }
mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; border-radius: 2px; }
mark.cur { background: var(--warn); color: #000; }

.files-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: start; }
.files-layout.expanded { grid-template-columns: minmax(0, 1fr); }
.files-layout.expanded .file-nav, .files-layout.expanded .below { display: none; }
.file-nav { padding: 10px; position: sticky; top: 132px; display: grid; gap: 10px; }
.file-nav h3 { font-size: 12.5px; color: var(--muted); margin: 6px 6px 2px; font-weight: 600; }
.file-btn { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; font: 13px var(--mono); color: var(--ink); }
.file-btn:hover { background: var(--panel-2); }
.file-btn[aria-current="true"] { background: var(--plan-soft); color: var(--plan); font-weight: 600; }
.file-btn .edited { margin-left: auto; font: 10.5px var(--sans); color: var(--warn); }
.file-btn .ln { margin-left: auto; font-size: 11px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 5px 10px; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--plan-soft); color: var(--plan); font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line); }
.editor-card { overflow: hidden; }
.ed-toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--panel-2); }
.ed-toolbar .fname { font: 600 14px var(--mono); margin-right: auto; display: flex; gap: 8px; align-items: center; }
.code-search { display: flex; align-items: center; gap: 4px; }
.code-search input { width: 170px; padding: 4px 8px; font-size: 13px; }
.code-search .cnt { font: 12px var(--mono); color: var(--muted); min-width: 44px; text-align: center; }
.ed { position: relative; display: grid; grid-template-columns: auto 1fr; height: min(62vh, 640px); background: var(--code-bg); }
.files-layout.expanded .ed { height: calc(100vh - 230px); }
.gutter { background: var(--gutter); color: var(--muted); text-align: right; padding: 12px 10px 12px 14px; overflow: hidden; user-select: none; border-right: 1px solid var(--line-2); min-width: 52px; }
.ed-main { position: relative; overflow: hidden; }
.ed-main pre, .ed-main textarea { position: absolute; inset: 0; margin: 0; padding: 12px 16px; border: 0; white-space: pre; overflow: auto; font: 13px/20px var(--mono); tab-size: 2; }
.ed-main pre { pointer-events: none; overflow: hidden; color: var(--ink); }
.ed-main textarea { color: transparent; background: transparent; caret-color: var(--ink); resize: none; outline: none; }
.ed-main textarea::selection { background: color-mix(in srgb, var(--plan) 30%, transparent); color: transparent; }
.ed-main pre .endpad { display: inline-block; height: 40px; }
.below { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
.below .panel { padding: 14px 16px; }
.below h3 { margin: 0 0 10px; font-size: 15px; }
.res-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.res-list li { display: flex; align-items: center; gap: 8px; font: 13px var(--mono); padding: 5px 0; border-bottom: 1px solid var(--line-2); }
.res-list li:last-child { border-bottom: 0; }
.res-list .addr { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.checks { display: grid; gap: 4px; }
.check > summary { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 5px 0; font-size: 14px; list-style: none; }
.check > summary::-webkit-details-marker { display: none; }
.check > summary .lvl { margin-left: auto; font-size: 12px; color: var(--muted); }
.check ul { list-style: none; margin: 0 0 6px 26px; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.check ul li { display: flex; gap: 6px; }
.check ul li .mark { width: 15px; height: 15px; font-size: 9.5px; margin-top: 2px; }
.callout { border-left: 3px solid var(--info); background: color-mix(in srgb, var(--info) 8%, transparent); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 13.5px; }
.callout.warn { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 9%, transparent); }
.gen-empty { padding: 60px 24px; text-align: center; }
.gen-empty h2 { margin: 0 0 8px; }
.gen-empty p { color: var(--muted); max-width: 520px; margin: 0 auto 16px; }
.banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 14px; border-radius: 8px; background: color-mix(in srgb, var(--warn) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); font-size: 14px; flex-wrap: wrap; }
.banner .btn { margin-left: auto; }
.toolbar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar-row .grow { flex: 1; }

/* ---------- architecture ---------- */
.arch-wrap { padding: 0; overflow: hidden; }
.arch-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.arch-head h2 { font-size: 15px; margin: 0 auto 0 0; }
.arch-canvas { overflow: auto; background-color: var(--panel); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px), linear-gradient(color-mix(in srgb, var(--grid) 50%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--grid) 50%, transparent) 1px, transparent 1px); background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px; }
.arch-canvas svg { display: block; margin: 0 auto; }
.arch-canvas .node { cursor: pointer; }
.arch-canvas .node:focus-visible rect.body { stroke: var(--plan); stroke-width: 2.5; }
.arch-canvas .node:hover rect.body { stroke-width: 2; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding: 10px 16px; border-top: 1px solid var(--line); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 22px; height: 0; border-top: 2px solid var(--muted); display: inline-block; }
.legend i.dash { border-top-style: dashed; }

/* ---------- modules / learn / cli ---------- */
.stack { display: grid; gap: 14px; }
.intro { padding: 16px 18px; }
.intro h2 { margin: 0 0 6px; font-size: 17px; }
.intro p { margin: 0; color: var(--muted); font-size: 14px; max-width: 900px; }
.chain { display: grid; grid-template-columns: 1fr 28px 1fr 28px 1.2fr; align-items: stretch; padding: 14px; gap: 0; }
.chain > .arrow { display: grid; place-items: center; color: var(--muted); }
.chain .step { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; font-size: 13.5px; }
.chain .step h4 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; }
.chain .step .mono { word-break: break-all; }
.chain .step.module { border-color: color-mix(in srgb, var(--db) 45%, var(--line)); }
.chain .step.none { border-style: dashed; color: var(--muted); }
.mod-title { display: flex; align-items: center; gap: 10px; padding: 12px 14px 0; }
.mod-title h3 { margin: 0; font-size: 15px; }
.topic-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.topic-col h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.topic { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; margin-bottom: 8px; }
.topic summary { cursor: pointer; padding: 10px 12px; font-weight: 600; font-size: 14px; list-style: none; display: flex; align-items: center; gap: 8px; }
.topic summary::-webkit-details-marker { display: none; }
.topic summary::after { content: "+"; margin-left: auto; color: var(--muted); font-weight: 400; }
.topic[open] summary::after { content: "\2212"; }
.topic .tb { padding: 0 12px 12px; font-size: 13.5px; color: var(--muted); display: grid; gap: 10px; }
.flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 16px 18px; }
.flow .st { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--panel-2); font: 13px var(--mono); }
.flow .st.first { font-family: var(--sans); }
.flow .ar { color: var(--muted); }
.cmd { display: grid; grid-template-columns: minmax(0, 260px) 1fr auto; gap: 14px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line-2); font-size: 14px; }
.cmd code { font-size: 13px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 8px; }
.cmd p { margin: 0; color: var(--muted); }
.auth-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0 16px 16px; }
.auth-grid .box p { margin: 0 0 8px; font-size: 13.5px; color: var(--muted); }

/* ---------- footer ---------- */
.brand p.byline { font-size: 12px; color: var(--plan); font-weight: 600; margin-top: 1px; }
.site-foot { max-width: 1600px; margin: 0 auto; padding: 18px 20px calc(28px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; gap: 8px 20px; justify-content: space-between; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
.site-foot b { color: var(--ink); }

/* ---------- toast ---------- */
.toasts { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; translate: -50% 0; z-index: 60; display: grid; gap: 8px; justify-items: center; }
.toast { background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 14px; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; animation: tin .2s ease; }
.toast button { background: none; border: 0; color: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 0; }
@keyframes tin { from { opacity: 0; translate: 0 8px; } }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .summary { position: static; max-height: none; }
  .topic-cols { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 860px) {
  .svc-layout, .files-layout { grid-template-columns: minmax(0, 1fr); }
  .filters, .file-nav { position: static; }
  .file-nav { display: flex; flex-wrap: wrap; gap: 4px; }
  .file-nav h3 { width: 100%; }
  .file-btn { width: auto; }
  .below { grid-template-columns: 1fr; }
  .chain { grid-template-columns: 1fr; }
  .chain > .arrow { transform: rotate(90deg); height: 24px; }
  .topic-cols, .auth-grid { grid-template-columns: 1fr; }
  .cmd { grid-template-columns: 1fr auto; }
  .cmd p { grid-column: 1 / -1; grid-row: 2; }
  .search input { width: 100%; }
  .search { flex: 1 1 100%; order: 10; }
  .form-grid { grid-template-columns: 1fr; }
  .layout { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand-row">
      <div class="brand">
        <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
          <rect x="1" y="1" width="38" height="38" rx="9" fill="var(--plan)"/>
          <path d="M9 12.5l7 4v8l-7-4z" fill="#fff" opacity=".55"/><path d="M17.5 17.5l7-4v8l-7 4z" fill="#fff"/><path d="M17.5 27l7-4v8l-7-4z" fill="#fff" opacity=".8"/><path d="M26 12.5l6-3.5v8l-6 3.5z" fill="#fff" opacity=".7"/>
        </svg>
        <div>
          <h1>Terraform AWS Studio</h1>
          <p>AWS Provider | Terraform Registry | Infrastructure as Code</p>
          <p class="byline">&copy; Created by Ashu Saini</p>
        </div>
      </div>
      <div class="controls">
        <label class="ctl" title="Sets required_version in providers.tf">Terraform
          <select class="inp" id="tfVersion"></select></label>
        <label class="ctl" id="provCtl">AWS provider
          <select class="inp" id="provVersion"></select></label>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <label class="sr" for="q">Search services, resources or keywords</label>
          <input class="inp" id="q" type="search" placeholder="Search services or aws_ resources" autocomplete="off">
          <kbd aria-hidden="true">/</kbd>
        </div>
        <button class="btn ghost" id="themeBtn" title="Toggle dark or light mode" aria-label="Toggle dark or light mode"></button>
        <button class="btn" id="resetBtn">Reset</button>
        <button class="btn primary" id="genBtnTop">Generate Terraform</button>

  <span class="hint">Not affiliated with AWS or HashiCorp. Terraform and AWS are trademarks of their respective owners.</span>

<div class="scrim" id="scrim" hidden></div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>(function () {
'use strict';
/* ==========================================================================
   catalog.js — AWS service metadata + per-service Terraform generators.
   Every resource type used here is a real hashicorp/aws resource; each
   service lists its types so the UI can link to the Registry docs.
   ========================================================================== */

const REGISTRY_BASE = 'https://registry.terraform.io/providers/hashicorp/aws/latest/docs/';
function docUrl(t) {
  if (t === 'data.archive_file') return 'https://registry.terraform.io/providers/hashicorp/archive/latest/docs/data-sources/file';
  if (t.startsWith('data.aws_')) return REGISTRY_BASE + 'data-sources/' + t.slice(9);
  return REGISTRY_BASE + 'resources/' + t.replace(/^aws_/, '');
}

/* ---------- HCL value + block builders ---------- */
function hq(s) { return JSON.stringify(String(s)).replace(/\$\{/g, '$${').replace(/%\{/g, '%%{'); }
function hv(v) {
  if (v === null || v === undefined) return 'null';
  if (typeof v === 'boolean' || typeof v === 'number') return String(v);
  if (typeof v === 'string') return hq(v);
  if (Array.isArray(v)) {
    if (!v.length) return '[]';
    if (v.every(x => x === null || typeof x !== 'object')) return '[' + v.map(hv).join(', ') + ']';
    return '[\n' + v.map(x => indentLines(hv(x), '  ')).join(',\n') + ',\n]';
  }
  const ks = Object.keys(v);
  if (!ks.length) return '{}';
  const allScalar = ks.every(k => v[k] === null || typeof v[k] !== 'object');
  return '{\n' + ks.map(k => indentLines((/^[A-Za-z_][\w-]*$/.test(k) ? k : hq(k)) + ' = ' + hv(v[k]), '  ')).join('\n') + '\n}';
}
function indentLines(s, ind) { return s.split('\n').map(l => (l ? ind + l : l)).join('\n'); }
const B = (h, b) => ({ h, b });
function renderBlock(h, items, ind = '') {
  const inner = ind + '  ';
  const out = [ind + h + ' {'];
  for (const it of items) {
    if (it === null || it === undefined || it === false) continue;
    if (typeof it === 'string') {
      if (it === '') { out.push(''); continue; }
      const lines = it.split('\n');
      out.push(lines.map(l => (l ? inner + l : '')).join('\n'));
    } else out.push(renderBlock(it.h, it.b, inner));
  }
  out.push(ind + '}');
  return out.join('\n');
}
const R = (h, items) => renderBlock(h, items);
const N = s => `"\${local.name_prefix}-${s}"`;
const tags = (nameExpr, extra) => {
  const lines = ['Name = ' + nameExpr];
  if (extra) for (const k of Object.keys(extra)) lines.push(k + ' = ' + extra[k]);
  return 'tags = {\n' + lines.map(l => '  ' + l).join('\n') + '\n}';
};
const csv = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean);

/* ---------- Service definitions ----------
   field: { k, l, t: text|number|bool|select|list, d, o, h }
*/
const CATS = {
  networking: { label: 'Networking', color: 'net' },
  compute: { label: 'Compute', color: 'cmp' },
  database: { label: 'Database', color: 'db' },
  storage: { label: 'Storage', color: 'sto' },
};

const SERVICES = [];
function S(def) { def.fields = def.fields || []; def.deps = def.deps || []; def.kw = def.kw || ''; def.assume = def.assume || []; SERVICES.push(def); }

/* ============================ NETWORKING ============================ */
S({
  id: 'vpc', name: 'VPC', cat: 'networking', diff: 'Beginner', file: 'vpc',
  res: ['aws_vpc'], kw: 'vpc network cidr',
  desc: 'An isolated virtual network that every other networking resource lives inside.',
  use: 'The foundation for any workload that needs private IP addressing.',
  fields: [
    { k: 'name', l: 'VPC name', t: 'text', d: 'learning-vpc' },
    { k: 'cidr', l: 'CIDR block', t: 'text', d: '10.0.0.0/16', h: 'A /16 gives 65,536 addresses to carve into subnets.' },
    { k: 'dns_support', l: 'Enable DNS support', t: 'bool', d: true },
    { k: 'dns_hostnames', l: 'Enable DNS hostnames', t: 'bool', d: true, h: 'Needed for VPC endpoints with private DNS and for EKS.' },
  ],
  gen(c, x) {
    x.v('vpc_name', 'string', 'Name tag for the VPC', c.name);
    x.v('vpc_cidr', 'string', 'IPv4 CIDR block for the VPC', c.cidr, { condition: 'can(cidrhost(var.vpc_cidr, 0))', error: 'vpc_cidr must be a valid IPv4 CIDR block, for example 10.0.0.0/16.' });
    x.v('vpc_enable_dns_support', 'bool', 'Enable the Amazon-provided DNS resolver in the VPC', c.dns_support);
    x.v('vpc_enable_dns_hostnames', 'bool', 'Assign public DNS hostnames to instances with public IPs', c.dns_hostnames);
    x.o('vpc_id', 'aws_vpc.main.id', 'ID of the VPC');
    x.o('vpc_cidr_block', 'aws_vpc.main.cidr_block', 'CIDR block of the VPC');
    return R('resource "aws_vpc" "main"', [
      'cidr_block = var.vpc_cidr',
      'enable_dns_support = var.vpc_enable_dns_support',
      'enable_dns_hostnames = var.vpc_enable_dns_hostnames',
      '',
      tags('var.vpc_name'),
    ]);
  },
});

S({
  id: 'subnet', name: 'Subnet', cat: 'networking', diff: 'Beginner', file: 'subnet',
  res: ['aws_subnet', 'data.aws_availability_zones'], deps: ['vpc'], kw: 'vpc subnet public private az',
  desc: 'Public and private subnets spread across Availability Zones, created with for_each.',
  use: 'Placing load balancers in public subnets and apps or databases in private ones.',
  fields: [
    { k: 'public', l: 'Public subnet CIDRs', t: 'list', d: '10.0.1.0/24, 10.0.2.0/24', h: 'Comma-separated. Each one lands in a different AZ.' },
    { k: 'private', l: 'Private subnet CIDRs', t: 'list', d: '10.0.11.0/24, 10.0.12.0/24' },
    { k: 'map_public', l: 'Auto-assign public IPs in public subnets', t: 'bool', d: false, h: 'Off by default. Turn on only if instances in public subnets need direct internet access.' },
  ],
  assume: ['Subnets are assigned to AZs by index from the aws_availability_zones data source, so the plan adapts to your region.'],
  gen(c, x) {
    const mk = (list, p) => { const o = {}; list.forEach((cidr, i) => { o[`${p}-${'abcdef'[i] || i}`] = { cidr_block: cidr, az_index: i }; }); return o; };
    const t = 'map(object({ cidr_block = string, az_index = number }))';
    x.v('public_subnets', t, 'Public subnets keyed by name; az_index picks an Availability Zone', mk(csv(c.public), 'public'));
    x.v('private_subnets', t, 'Private subnets keyed by name; az_index picks an Availability Zone', mk(csv(c.private), 'private'));
    x.v('public_subnet_map_public_ip', 'bool', 'Auto-assign public IPv4 addresses to instances launched in public subnets', c.map_public);
    x.azData();
    x.o('public_subnet_ids', '[for s in aws_subnet.public : s.id]', 'IDs of the public subnets');
    x.o('private_subnet_ids', '[for s in aws_subnet.private : s.id]', 'IDs of the private subnets');
    const sub = (name, tier, mapIp) => R(`resource "aws_subnet" "${name}"`, [
      `for_each = var.${name}_subnets`,
      '',
      'vpc_id = ' + x.vpcId(),
      'cidr_block = each.value.cidr_block',
      'availability_zone = data.aws_availability_zones.available.names[each.value.az_index]',
      'map_public_ip_on_launch = ' + mapIp,
      '',
      tags('"${local.name_prefix}-${each.key}"', { Tier: hq(tier) }),
    ]);
    return sub('public', 'public', 'var.public_subnet_map_public_ip') + '\n\n' + sub('private', 'private', 'false');
  },
});

S({
  id: 'route_table', name: 'Route Table', cat: 'networking', diff: 'Beginner', file: 'route_table',
  res: ['aws_route_table', 'aws_route_table_association'], deps: ['vpc', 'subnet', 'igw'], kw: 'vpc route routing',
  desc: 'Public and private route tables, with routes to the internet or NAT gateway when those are selected.',
  use: 'Sending public subnet traffic to the internet gateway and private traffic through NAT.',
  assume: ['Routes are only added for gateways you have selected; otherwise the table holds just the local VPC route.'],
  gen(c, x) {
    const igw = x.has('igw'), nat = x.has('nat');
    let h = R('resource "aws_route_table" "public"', [
      'vpc_id = ' + x.vpcId(),
      igw ? '' : null,
      igw ? B('route', ['cidr_block = "0.0.0.0/0"', 'gateway_id = aws_internet_gateway.main.id']) : null,
      '',
      tags(N('public-rt')),
    ]) + '\n\n' + R('resource "aws_route_table" "private"', [
      'vpc_id = ' + x.vpcId(),
      nat ? '' : null,
      nat ? B('route', ['cidr_block = "0.0.0.0/0"', 'nat_gateway_id = aws_nat_gateway.main.id']) : null,
      '',
      tags(N('private-rt')),
    ]);
    if (x.has('subnet')) {
      for (const t of ['public', 'private']) {
        h += '\n\n' + R(`resource "aws_route_table_association" "${t}"`, [
          `for_each = aws_subnet.${t}`,
          '',
          'subnet_id = each.value.id',
          `route_table_id = aws_route_table.${t}.id`,
        ]);
      }
    } else x.note('Route table associations were skipped because the Subnet service is not selected.');
    x.o('public_route_table_id', 'aws_route_table.public.id', 'ID of the public route table');
    x.o('private_route_table_id', 'aws_route_table.private.id', 'ID of the private route table');
    return h;
  },
});

S({
  id: 'igw', name: 'Internet Gateway', cat: 'networking', diff: 'Beginner', file: 'internet_gateway',
  res: ['aws_internet_gateway'], deps: ['vpc'], kw: 'vpc igw internet',
  desc: 'Connects the VPC to the internet for resources in public subnets.',
  use: 'Giving public load balancers and bastion-free public endpoints a path to the internet.',
  gen(c, x) {
    x.o('internet_gateway_id', 'aws_internet_gateway.main.id', 'ID of the internet gateway');
    return R('resource "aws_internet_gateway" "main"', ['vpc_id = ' + x.vpcId(), '', tags(N('igw'))]);
  },
});

S({
  id: 'eip', name: 'Elastic IP', cat: 'networking', diff: 'Beginner', file: 'elastic_ip',
  res: ['aws_eip'], kw: 'eip ip address static',
  desc: 'A static public IPv4 address. Used by the NAT gateway when both are selected.',
  use: 'Stable egress IPs that partners can allow-list.',
  gen(c, x) {
    const n = x.has('nat') ? 'nat' : 'main';
    x.o('eip_public_ip', `aws_eip.${n}.public_ip`, 'Public IPv4 address of the Elastic IP');
    x.o('eip_allocation_id', `aws_eip.${n}.allocation_id`, 'Allocation ID of the Elastic IP');
    return R(`resource "aws_eip" "${n}"`, ['domain = "vpc"', '', tags(N(n === 'nat' ? 'nat-eip' : 'eip'))]);
  },
});

S({
  id: 'nat', name: 'NAT Gateway', cat: 'networking', diff: 'Intermediate', file: 'nat_gateway',
  res: ['aws_nat_gateway', 'aws_eip'], deps: ['vpc', 'subnet', 'igw', 'eip', 'route_table'], kw: 'vpc nat egress',
  desc: 'Lets resources in private subnets reach the internet without being reachable from it.',
  use: 'Package updates and outbound API calls from private instances or containers.',
  assume: ['A single NAT gateway is created in the first public subnet. Production designs often use one per AZ.'],
  gen(c, x) {
    let h = '';
    if (!x.has('eip')) h += R('resource "aws_eip" "nat"', ['domain = "vpc"', '', tags(N('nat-eip'))]) + '\n\n';
    h += R('resource "aws_nat_gateway" "main"', [
      'allocation_id = aws_eip.nat.id',
      'subnet_id = ' + x.firstPublic(),
      '',
      tags(N('nat')),
      x.has('igw') ? '' : null,
      x.has('igw') ? '# The AWS provider docs recommend this explicit dependency so the\n# internet gateway exists before the NAT gateway starts routing.\ndepends_on = [aws_internet_gateway.main]' : null,
    ]);
    x.o('nat_gateway_id', 'aws_nat_gateway.main.id', 'ID of the NAT gateway');
    x.o('nat_gateway_public_ip', 'aws_nat_gateway.main.public_ip', 'Public IP used for outbound traffic from private subnets');
    return h;
  },
});

S({

S({
  id: 'waf', name: 'AWS WAF', cat: 'networking', diff: 'Advanced', file: 'waf',
  res: ['aws_wafv2_web_acl', 'aws_wafv2_web_acl_association'], deps: ['alb'], kw: 'waf firewall wafv2 security',
  desc: 'A WAFv2 web ACL with AWS managed rule groups. Scope follows what it protects.',
  use: 'Blocking common exploits (OWASP-style) in front of an ALB or CloudFront.',
  assume: ['With CloudFront selected the web ACL uses CLOUDFRONT scope, which must be created in us-east-1, so an aliased provider is added.'],
  gen(c, x) {
    const cf = x.has('cloudfront');
    if (cf) x.flags.useast1 = true;
    const rule = (name, pri, group) => B('rule', [
      `name = "${name}"`, `priority = ${pri}`, '',
      B('override_action', ['none {}']), '',
      B('statement', [B('managed_rule_group_statement', [`name = "${group}"`, 'vendor_name = "AWS"'])]), '',
      B('visibility_config', ['cloudwatch_metrics_enabled = true', `metric_name = "${name}"`, 'sampled_requests_enabled = true']),
    ]);
    let h = R('resource "aws_wafv2_web_acl" "main"', [
      cf ? '# CloudFront-scoped web ACLs must live in us-east-1.\nprovider = aws.us_east_1\n' : null,
      'name = "${local.name_prefix}-web-acl"',
      'description = "Baseline AWS managed rules"',
      `scope = "${cf ? 'CLOUDFRONT' : 'REGIONAL'}"`,
      '',
      B('default_action', ['allow {}']),
      '',
      rule('aws-common-rule-set', 1, 'AWSManagedRulesCommonRuleSet'),
      '',
      rule('aws-known-bad-inputs', 2, 'AWSManagedRulesKnownBadInputsRuleSet'),
      '',
      B('visibility_config', ['cloudwatch_metrics_enabled = true', 'metric_name = "${local.name_prefix}-web-acl"', 'sampled_requests_enabled = true']),
      '',
      tags(N('web-acl')),
    ]);
    if (!cf && x.has('alb')) h += '\n\n' + R('resource "aws_wafv2_web_acl_association" "alb"', ['resource_arn = aws_lb.app.arn', 'web_acl_arn = aws_wafv2_web_acl.main.arn']);
    x.o('web_acl_arn', 'aws_wafv2_web_acl.main.arn', 'ARN of the WAF web ACL');
    return h;
  },
});

S({
  id: 'cloudfront', name: 'CloudFront', cat: 'networking', diff: 'Advanced', file: 'cloudfront',
  res: ['aws_cloudfront_distribution', 'aws_cloudfront_origin_access_control', 'data.aws_cloudfront_cache_policy'], deps: ['s3', 'waf'], kw: 'cloudfront cdn distribution edge',
  desc: 'A global CDN distribution. Uses S3 with origin access control, or the ALB, as its origin.',
  use: 'Serving static sites or caching an application at the edge with HTTPS.',
  fields: [{ k: 'price_class', l: 'Price class', t: 'select', d: 'PriceClass_200', o: ['PriceClass_100', 'PriceClass_200', 'PriceClass_All'] }],
  assume: ['Uses the default *.cloudfront.net certificate. A custom domain needs an ACM certificate in us-east-1.', 'The ALB origin uses HTTP between CloudFront and the ALB for simplicity; use HTTPS end-to-end in production.'],
  gen(c, x) {
    const s3 = x.has('s3'), alb = !s3 && x.has('alb');
    x.v('cloudfront_price_class', 'string', 'CloudFront price class', c.price_class);
    const cache = s3 ? 'Managed-CachingOptimized' : 'Managed-CachingDisabled';
    let h = R('data "aws_cloudfront_cache_policy" "selected"', [`name = "${cache}"`]) + '\n\n';
    if (alb) h += R('data "aws_cloudfront_origin_request_policy" "all_viewer"', ['name = "Managed-AllViewer"']) + '\n\n';
    let origin;
    if (s3) {
      h += R('resource "aws_cloudfront_origin_access_control" "s3"', [
        'name = "${local.name_prefix}-s3-oac"', 'description = "CloudFront access to the S3 origin"',
        'origin_access_control_origin_type = "s3"', 'signing_behavior = "always"', 'signing_protocol = "sigv4"',
      ]) + '\n\n';
      origin = B('origin', ['origin_id = "primary"', 'domain_name = aws_s3_bucket.main.bucket_regional_domain_name', 'origin_access_control_id = aws_cloudfront_origin_access_control.s3.id']);
    } else {
      const dom = alb ? 'aws_lb.app.dns_name' : x.v('cloudfront_origin_domain', 'string', 'Domain name of a custom origin', 'origin.example.com');
      origin = B('origin', ['origin_id = "primary"', 'domain_name = ' + dom, '',
        B('custom_origin_config', ['http_port = 80', 'https_port = 443', `origin_protocol_policy = "${alb ? 'http-only' : 'https-only'}"`, 'origin_ssl_protocols = ["TLSv1.2"]'])]);
    }
    h += R('resource "aws_cloudfront_distribution" "main"', [
      'enabled = true', 'is_ipv6_enabled = true', 'comment = "${local.name_prefix} distribution"', 'price_class = var.cloudfront_price_class',
      s3 ? 'default_root_object = "index.html"' : null,
      x.has('waf') ? 'web_acl_id = aws_wafv2_web_acl.main.arn' : null,
      '', origin, '',
      B('default_cache_behavior', [
        'target_origin_id = "primary"', 'viewer_protocol_policy = "redirect-to-https"',
        s3 ? 'allowed_methods = ["GET", "HEAD", "OPTIONS"]' : 'allowed_methods = ["DELETE", "GET", "HEAD", "OPTIONS", "PATCH", "POST", "PUT"]',
        'cached_methods = ["GET", "HEAD"]', 'compress = true', 'cache_policy_id = data.aws_cloudfront_cache_policy.selected.id',
        alb ? 'origin_request_policy_id = data.aws_cloudfront_origin_request_policy.all_viewer.id' : null,
      ]), '',
      B('restrictions', [B('geo_restriction', ['restriction_type = "none"'])]), '',
      B('viewer_certificate', ['cloudfront_default_certificate = true']), '',
      tags(N('cdn')),
    ]);
    if (s3) {
      h += '\n\n' + R('data "aws_iam_policy_document" "cloudfront_s3"', [B('statement', [
        'sid = "AllowCloudFrontRead"', 'actions = ["s3:GetObject"]', 'resources = ["${aws_s3_bucket.main.arn}/*"]', '',
        B('principals', ['type = "Service"', 'identifiers = ["cloudfront.amazonaws.com"]']), '',
        B('condition', ['test = "StringEquals"', 'variable = "AWS:SourceArn"', 'values = [aws_cloudfront_distribution.main.arn]']),
      ])]) + '\n\n' + R('resource "aws_s3_bucket_policy" "cloudfront"', ['bucket = aws_s3_bucket.main.id', 'policy = data.aws_iam_policy_document.cloudfront_s3.json']);
    }
    x.o('cloudfront_domain_name', 'aws_cloudfront_distribution.main.domain_name', 'CloudFront distribution domain name');
    x.o('cloudfront_distribution_id', 'aws_cloudfront_distribution.main.id', 'CloudFront distribution ID');
    return h;
  },
});

/* ============================ COMPUTE ============================ */
function amiData(x, instanceType) {
  const arm = /^[a-z]+\d+[a-z]*g[a-z]*\./.test(instanceType || '');
  const arch = arm ? 'arm64' : 'x86_64';
  const name = 'al2023_' + arch;
  x.data(name, R(`data "aws_ami" "${name}"`, [
    'most_recent = true', 'owners = ["amazon"]', '',
    B('filter', ['name = "name"', `values = ["al2023-ami-2023.*-${arch}"]`]), '',
    B('filter', ['name = "virtualization-type"', 'values = ["hvm"]']),
  ]));
  return `data.aws_ami.${name}.id`;
}

S({
  id: 'lambda', name: 'Lambda Function', cat: 'compute', diff: 'Intermediate', file: 'lambda',
  res: ['aws_lambda_function', 'aws_iam_role', 'aws_cloudwatch_log_group', 'data.archive_file'], kw: 'lambda serverless function',
  desc: 'A function packaged from local source with the archive provider, with its own least-privilege role.',
  use: 'Event handlers, small APIs and scheduled jobs without servers.',
  fields: [
    { k: 'name', l: 'Function name', t: 'text', d: 'learning-fn' },
    { k: 'runtime', l: 'Runtime', t: 'select', d: 'python3.13', o: ['python3.13', 'python3.12', 'nodejs22.x'] },
    { k: 'memory', l: 'Memory (MB)', t: 'number', d: 256 },
    { k: 'timeout', l: 'Timeout (seconds)', t: 'number', d: 10 },
  ],
  assume: ['A starter handler is written to lambda_src/ in the ZIP and packaged by the hashicorp/archive provider at plan time.', 'The function runs outside the VPC unless both Subnet and Security Group are selected.'],
  gen(c, x) {
    x.flags.archive = true;
    const node = c.runtime.startsWith('nodejs');
    x.extraFiles[node ? 'lambda_src/index.mjs' : 'lambda_src/index.py'] = node
      ? 'export const handler = async (event) => {\n  return { statusCode: 200, body: JSON.stringify({ message: "Hello from Terraform" }) };\n};\n'
      : 'import json\n\n\ndef handler(event, context):\n    return {"statusCode": 200, "body": json.dumps({"message": "Hello from Terraform"})}\n';
    x.v('lambda_function_name', 'string', 'Name of the Lambda function', c.name);
    x.v('lambda_runtime', 'string', 'Lambda runtime identifier', c.runtime);
    x.v('lambda_memory_size', 'number', 'Memory in MB (also scales CPU)', Number(c.memory));
    x.v('lambda_timeout', 'number', 'Timeout in seconds', Number(c.timeout), { condition: 'var.lambda_timeout >= 1 && var.lambda_timeout <= 900', error: 'Lambda timeout must be between 1 and 900 seconds.' });
    const inVpc = x.has('subnet') && x.has('sg');
    x.o('lambda_function_arn', 'aws_lambda_function.main.arn', 'ARN of the Lambda function');
    x.o('lambda_function_name', 'aws_lambda_function.main.function_name', 'Name of the Lambda function');
    return R('data "archive_file" "lambda"', ['type = "zip"', 'source_dir = "${path.module}/lambda_src"', 'output_path = "${path.module}/build/lambda.zip"'])
      + '\n\n' + assumeDoc('lambda', 'lambda.amazonaws.com')
      + '\n\n' + R('resource "aws_iam_role" "lambda"', ['name_prefix = "${local.name_prefix}-lambda-"', 'assume_role_policy = data.aws_iam_policy_document.lambda_assume.json'])
      + '\n\n' + R('resource "aws_iam_role_policy_attachment" "lambda_basic"', ['role = aws_iam_role.lambda.name', `policy_arn = "arn:aws:iam::aws:policy/service-role/${inVpc ? 'AWSLambdaVPCAccessExecutionRole' : 'AWSLambdaBasicExecutionRole'}"`])
      + '\n\n' + R('resource "aws_cloudwatch_log_group" "lambda"', ['name = "/aws/lambda/${var.lambda_function_name}"', 'retention_in_days = 14'])
      + '\n\n' + R('resource "aws_lambda_function" "main"', [
        'function_name = var.lambda_function_name',
        'description = "Managed by Terraform"',
        'role = aws_iam_role.lambda.arn',
        'runtime = var.lambda_runtime',
        'handler = "index.handler"',
        'architectures = ["arm64"]',
        'memory_size = var.lambda_memory_size',
        'timeout = var.lambda_timeout',
        '',
        'filename = data.archive_file.lambda.output_path',
        'source_code_hash = data.archive_file.lambda.output_base64sha256',
        '',
        B('environment', ['variables = {\n  ENVIRONMENT = var.environment\n}']),
        '',
        B('logging_config', ['log_format = "JSON"', 'log_group = aws_cloudwatch_log_group.lambda.name']),
        inVpc ? '' : null,
        inVpc ? B('vpc_config', ['subnet_ids = ' + x.privateIds(), 'security_group_ids = [aws_security_group.main.id]']) : null,
        '',
        '# The role needs its log permissions before the first invocation.',
        'depends_on = [aws_iam_role_policy_attachment.lambda_basic]',
      ]);
  },
});

function assumeDoc(name, service) {
  return R(`data "aws_iam_policy_document" "${name}_assume"`, [B('statement', [
    'effect = "Allow"', 'actions = ["sts:AssumeRole"]', '',
    B('principals', ['type = "Service"', `identifiers = ["${service}"]`]),
  ])]);
}

function rdsService(id, name, engineLocked, resName, extraDesc) {
  const pfx = id;
  const fields = [];
  if (!engineLocked) fields.push({ k: 'engine', l: 'Engine', t: 'select', d: 'postgres', o: ['postgres', 'mysql', 'mariadb', 'sqlserver-ex'] });
  const sql = engineLocked === 'sqlserver-ex';
  fields.push(
    { k: 'class', l: 'Instance class', t: 'select', d: sql ? 'db.t3.small' : 'db.t4g.micro', o: sql ? ['db.t3.small', 'db.t3.medium', 'db.m6i.large'] : ['db.t4g.micro', 'db.t4g.small', 'db.t4g.medium', 'db.m7g.large'] },
    { k: 'storage', l: 'Allocated storage (GB)', t: 'number', d: 20 },
    { k: 'version', l: 'Engine version (optional)', t: 'text', d: '', h: 'Empty uses the RDS default for the engine. Pin a version for production.' },
  );
  if (!sql) fields.push({ k: 'dbname', l: 'Initial database name', t: 'text', d: 'appdb' });
  fields.push(
    { k: 'username', l: 'Master username', t: 'text', d: 'dbadmin' },
    { k: 'multi_az', l: 'Multi-AZ', t: 'bool', d: false, h: sql ? 'SQL Server Express does not support Multi-AZ.' : '' },
    { k: 'backup', l: 'Backup retention (days)', t: 'number', d: 7 },
    { k: 'deletion_protection', l: 'Deletion protection', t: 'bool', d: true, h: 'Turn off before running terraform destroy.' },
  );
  S({
    id, name, cat: 'database', diff: 'Intermediate', file: id,
    res: ['aws_db_instance'], deps: ['vpc', 'subnet', 'dbsg', 'sg', 'kms'], kw: 'rds database sql ' + (engineLocked || 'postgres mysql mariadb sqlserver'),
    desc: extraDesc,
    use: 'Managed relational databases with automated backups and patching.',
    fields,
    assume: ['The master password is never generated: manage_master_user_password stores it in AWS Secrets Manager.', 'skip_final_snapshot is false, so destroy takes a final snapshot.'],
    gen(c, x) {
      const engine = engineLocked || c.engine;
      const isSql = engine.startsWith('sqlserver');
      x.v(`${pfx}_instance_class`, 'string', `Instance class for ${name}`, c.class);
      x.v(`${pfx}_allocated_storage`, 'number', 'Initial storage in GiB', Number(c.storage), { condition: `var.${pfx}_allocated_storage >= 20`, error: 'RDS needs at least 20 GiB of gp3 storage.' });
      x.v(`${pfx}_engine_version`, 'string', 'Engine version. Null uses the RDS default', c.version || null);
      if (!isSql) x.v(`${pfx}_db_name`, 'string', 'Name of the initial database', c.dbname);
      x.v(`${pfx}_username`, 'string', 'Master username (the password is managed in Secrets Manager)', c.username);
      x.v(`${pfx}_multi_az`, 'bool', 'Deploy a synchronous standby in another AZ', isSql && engine === 'sqlserver-ex' ? false : c.multi_az);
      x.v(`${pfx}_backup_retention_days`, 'number', 'Days to keep automated backups', Number(c.backup));
      x.v(`${pfx}_deletion_protection`, 'bool', 'Block deletion of the database', c.deletion_protection);
      const sg = x.has('dbsg') ? 'aws_db_subnet_group.main.name' : x.v('db_subnet_group_name', 'string', 'Name of an existing DB subnet group');
      const kms = x.kmsArn();
      x.o(`${pfx}_address`, `aws_db_instance.${resName}.address`, `Hostname of ${name}`);
      x.o(`${pfx}_port`, `aws_db_instance.${resName}.port`, `Port of ${name}`);
      x.o(`${pfx}_master_secret_arn`, `aws_db_instance.${resName}.master_user_secret[0].secret_arn`, 'Secrets Manager ARN holding the master password');
      return R(`resource "aws_db_instance" "${resName}"`, [
        `identifier = ${N(id.replace(/_/g, '-'))}`,
        `engine = "${engine}"`,
        `engine_version = var.${pfx}_engine_version`,
        `instance_class = var.${pfx}_instance_class`,
        isSql ? 'license_model = "license-included"' : null,
        '',
        `allocated_storage = var.${pfx}_allocated_storage`,
        `max_allocated_storage = var.${pfx}_allocated_storage * 5`,
        'storage_type = "gp3"',
        'storage_encrypted = true',
        kms ? 'kms_key_id = ' + kms : null,
        '',
        isSql ? null : `db_name = var.${pfx}_db_name`,
        `username = var.${pfx}_username`,
        '# No password in code or state: RDS generates it and stores it in Secrets Manager.',
        'manage_master_user_password = true',
        '',
        'db_subnet_group_name = ' + sg,
        x.sgOpt('vpc_security_group_ids'),
        'publicly_accessible = false',
        `multi_az = var.${pfx}_multi_az`,
        '',
        `backup_retention_period = var.${pfx}_backup_retention_days`,
        'copy_tags_to_snapshot = true',
        'auto_minor_version_upgrade = true',
        `deletion_protection = var.${pfx}_deletion_protection`,
        'skip_final_snapshot = false',
        `final_snapshot_identifier = ${N(id.replace(/_/g, '-') + '-final')}`,
        '',
        tags(N(id.replace(/_/g, '-'))),
      ]);
    },
  });
}
rdsService('rds', 'RDS (choose engine)', null, 'main', 'One aws_db_instance resource covers PostgreSQL, MySQL, MariaDB and SQL Server; the engine argument decides.');
rdsService('rds_postgres', 'RDS PostgreSQL', 'postgres', 'postgres', 'aws_db_instance with engine = "postgres". Same resource as the other RDS cards.');
rdsService('rds_mysql', 'RDS MySQL', 'mysql', 'mysql', 'aws_db_instance with engine = "mysql". Same resource, different engine argument.');
rdsService('rds_sqlserver', 'RDS SQL Server', 'sqlserver-ex', 'sqlserver', 'aws_db_instance with engine = "sqlserver-ex" and license_model. db_name must be omitted for SQL Server.');

S({
  id: 'backup', name: 'AWS Backup', cat: 'storage', diff: 'Intermediate', file: 'backup',
  res: ['aws_backup_vault', 'aws_backup_plan', 'aws_backup_selection', 'aws_iam_role'], deps: ['kms'], kw: 'backup vault plan retention',
  desc: 'A vault, a daily plan and a selection that picks up your databases and file systems, plus anything tagged Backup=true.',
  use: 'Central, policy-driven backups with retention you can audit.',
  fields: [
    { k: 'schedule', l: 'Schedule (cron, UTC)', t: 'text', d: 'cron(0 18 * * ? *)', h: '18:00 UTC is 02:00 in Kuala Lumpur and Singapore.' },
    { k: 'retention', l: 'Retention (days)', t: 'number', d: 35 },
  ],
  gen(c, x) {
    x.v('backup_schedule', 'string', 'Backup schedule as an AWS cron expression (UTC)', c.schedule);
    x.v('backup_retention_days', 'number', 'Days to keep recovery points', Number(c.retention));
    const arns = [];
    for (const [id, r] of [['rds', 'main'], ['rds_postgres', 'postgres'], ['rds_mysql', 'mysql'], ['rds_sqlserver', 'sqlserver']]) if (x.has(id)) arns.push(`aws_db_instance.${r}.arn`);
    if (x.has('aurora')) arns.push('aws_rds_cluster.main.arn');
    if (x.has('dynamodb')) arns.push('aws_dynamodb_table.main.arn');
    if (x.has('efs')) arns.push('aws_efs_file_system.main.arn');
    if (x.has('ebs')) arns.push('aws_ebs_volume.data.arn');
    const kms = x.kmsArn();
    x.o('backup_vault_arn', 'aws_backup_vault.main.arn', 'ARN of the backup vault');
    x.o('backup_plan_id', 'aws_backup_plan.main.id', 'ID of the backup plan');

      + '\n\n' + R('resource "aws_backup_plan" "main"', ['name = "${local.name_prefix}-daily"', '',
        B('rule', ['rule_name = "daily"', 'target_vault_name = aws_backup_vault.main.name', 'schedule = var.backup_schedule', 'start_window = 60', 'completion_window = 180', '', B('lifecycle', ['delete_after = var.backup_retention_days'])])])
      + '\n\n' + assumeDoc('backup', 'backup.amazonaws.com')
      + '\n\n' + R('resource "aws_iam_role" "backup"', ['name_prefix = "${local.name_prefix}-backup-"', 'assume_role_policy = data.aws_iam_policy_document.backup_assume.json'])
      + '\n\n' + R('resource "aws_iam_role_policy_attachment" "backup"', ['role = aws_iam_role.backup.name', 'policy_arn = "arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup"'])
      + '\n\n' + R('resource "aws_backup_selection" "main"', ['name = "${local.name_prefix}-selection"', 'plan_id = aws_backup_plan.main.id', 'iam_role_arn = aws_iam_role.backup.arn',
        arns.length ? 'resources = [\n' + arns.map(a => '  ' + a + ',').join('\n') + '\n]' : null, '',
        B('selection_tag', ['type = "STRINGEQUALS"', 'key = "Backup"', 'value = "true"'])]);
  },
});

const TF_VERSIONS = ['1.15', '1.14', '1.13', '1.12', '1.11', '1.10', '1.9', '1.8'];
const REGIONS = ['ap-southeast-1', 'ap-southeast-5', 'ap-southeast-2', 'ap-southeast-3', 'ap-northeast-1', 'ap-south-1', 'us-east-1', 'us-west-2', 'eu-west-1', 'eu-central-1'];

function defaultConfig(svc) { const o = {}; for (const f of svc.fields) o[f.k] = f.d; return o; }

function makeCtx(sel, cfg) {
  const vars = new Map(), outs = new Map(), data = new Map(), notes = [], flags = { archive: false, useast1: false }, extraFiles = {};
  let current = null;
  const x = {
    has: id => sel.has(id),
    setCurrent(id) { current = id; },
    v(name, type, desc, def, val) {
      if (!vars.has(name)) vars.set(name, { type, desc, def, val, svc: current });
      return 'var.' + name;
    },
    o(name, value, desc) { outs.set(name, { value, desc, svc: current }); },
    data(key, hcl) { if (!data.has(key)) data.set(key, hcl); },
    note(s) { notes.push({ svc: current, text: s }); },
    flags, extraFiles,
    azData() { x.data('azs', R('data "aws_availability_zones" "available"', ['state = "available"'])); },
    caller() { x.data('caller', 'data "aws_caller_identity" "current" {}'); },
    vpcId() { return x.has('vpc') ? 'aws_vpc.main.id' : x.v('vpc_id', 'string', 'ID of an existing VPC (the VPC service is not selected)'); },
    privateIds() { return x.has('subnet') ? 'values(aws_subnet.private)[*].id' : x.v('private_subnet_ids', 'list(string)', 'IDs of existing private subnets (the Subnet service is not selected)'); },
    publicIds() { return x.has('subnet') ? 'values(aws_subnet.public)[*].id' : x.v('public_subnet_ids', 'list(string)', 'IDs of existing public subnets (the Subnet service is not selected)'); },
    firstPrivate() { return x.has('subnet') ? 'values(aws_subnet.private)[0].id' : x.privateIds() + '[0]'; },
    firstPublic() { return x.has('subnet') ? 'values(aws_subnet.public)[0].id' : x.publicIds() + '[0]'; },
    sgOpt(arg) { return x.has('sg') ? `${arg} = [aws_security_group.main.id]` : null; },
    kmsArn() { return x.has('kms') ? 'aws_kms_key.main.arn' : null; },
  };

}

/* ---------- formatting: tidy blank lines + align "=" like terraform fmt ---------- */
function tidy(text) {
  let lines = text.split('\n');
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (l.trim() === '') {
      const prev = out.length ? out[out.length - 1].trim() : '';
      const next = (lines.slice(i + 1).find(s => s.trim() !== '') || '').trim();
      if (!out.length || prev === '' || /[{[(]$/.test(prev) || /^[}\])]/.test(next)) continue;
    }
    out.push(l.replace(/\s+$/, ''));
  }
  return alignEquals(out).join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}
function alignEquals(lines) {
  const res = lines.slice();
  let group = [];
  const flush = () => {
    if (group.length > 1) {
      const w = Math.max(...group.map(g => g.key.length));
      for (const g of group) res[g.i] = g.ind + g.key.padEnd(w) + ' = ' + g.val;
    }
    group = [];
  };
  let depthStack = 0;
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(/^(\s*)([A-Za-z_][\w-]*|"[^"]+")\s*=\s(?!=)(.*)$/);
    const opensMulti = m && /[{[(]\s*$/.test(m[3]) && !/^\s*[{[(].*[}\])]\s*$/.test(m[3]);
    if (m && !opensMulti && m[1] !== undefined) {
      if (group.length && group[0].ind !== m[1]) flush();
      group.push({ i, ind: m[1], key: m[2], val: m[3] });
    } else if (m && opensMulti) {
      if (group.length && group[0].ind === m[1]) {
        group.push({ i, ind: m[1], key: m[2], val: m[3] });
      }
      flush();
    } else flush();
  }
  flush();
  return res;
}

/* ---------- main generator ---------- */
function generateProject(selIds, cfgAll, g) {
  const sel = new Set(selIds);
  const { x, vars, outs, data, notes, flags, extraFiles } = makeCtx(sel, cfgAll);
  const ordered = SERVICES.filter(s => sel.has(s.id));
  const svcFiles = [];

  // global variables first
  x.setCurrent('_global');
  x.v('aws_region', 'string', 'AWS region to deploy into', g.region, { condition: 'can(regex("^[a-z]{2}(-[a-z]+)+-\\\\d$", var.aws_region))', error: 'aws_region must look like ap-southeast-1.' });
  x.v('project_name', 'string', 'Short project name used in resource names (lowercase, hyphens)', g.project, { condition: 'can(regex("^[a-z][a-z0-9-]{1,20}$", var.project_name))', error: 'project_name must be 2-21 lowercase letters, numbers or hyphens, starting with a letter.' });
  x.v('environment', 'string', 'Deployment environment', g.env, { condition: 'contains(["dev", "staging", "prod"], var.environment)', error: 'environment must be dev, staging or prod.' });
  x.v('additional_tags', 'map(string)', 'Extra tags merged into the provider default_tags', {});

  for (const s of ordered) {
    x.setCurrent(s.id);
    const c = Object.assign(defaultConfig(s), cfgAll[s.id] || {});
    const body = s.gen(c, x);
    svcFiles.push({ svc: s, body });
  }

  const files = [];
  const header = (title, lines) => `# ${title}\n` + lines.map(l => '# ' + l).join('\n') + '\n\n';

  // providers.tf
  const reqProv = [
    'aws = {\n  source  = "hashicorp/aws"\n  version = ' + hq(g.provider) + '\n}',
    flags.archive ? 'archive = {\n  source  = "hashicorp/archive"\n  version = "~> 2.7"\n}' : null,
  ].filter(Boolean);
  let providers = header('providers.tf', [
    'Terraform and provider requirements.',
    'Authentication is NOT configured here: the AWS provider uses the standard',
    'credential chain (AWS_PROFILE / IAM Identity Center, environment, or an IAM role).',
  ]) + R('terraform', [
    `required_version = ">= ${g.tf}.0"`, '',
    B('required_providers', [reqProv.join('\n')]), '',
    '# Remote state with native S3 locking (Terraform 1.10+). Uncomment after creating the bucket.',
    '# backend "s3" {\n#   bucket       = "my-terraform-state-bucket"\n#   key          = "tf-learning/terraform.tfstate"\n#   region       = "ap-southeast-1"\n#   encrypt      = true\n#   use_lockfile = true\n# }',
  ]) + '\n\n' + R('provider "aws"', ['region = var.aws_region', '', B('default_tags', ['tags = local.common_tags'])]);
  if (flags.useast1) providers += '\n\n' + '# CloudFront-scoped resources (WAF, ACM certificates) must be created in us-east-1.\n' + R('provider "aws"', ['alias = "us_east_1"', 'region = "us-east-1"', '', B('default_tags', ['tags = local.common_tags'])]);
  files.push({ name: 'providers.tf', cat: 'root', content: tidy(providers) });

  // locals.tf
  files.push({ name: 'locals.tf', cat: 'root', content: tidy(header('locals.tf', ['Values computed once and reused everywhere.']) + R('locals', [
    'name_prefix = "${var.project_name}-${var.environment}"', '',
    'common_tags = merge(\n  {\n    Project     = var.project_name\n    Environment = var.environment\n    ManagedBy   = "Terraform"\n  },\n  var.additional_tags,\n)',
  ])) });

  // variables.tf
  let varsTxt = header('variables.tf', ['Every tunable value lives here. Override them in terraform.tfvars.']);
  let lastSvc = null;
  for (const [name, v] of vars) {
    if (v.svc !== lastSvc) { varsTxt += (lastSvc ? '\n' : '') + '# ' + (v.svc === '_global' ? 'Global' : SVC[v.svc].name) + '\n\n'; lastSvc = v.svc; }
    const items = ['description = ' + hq(v.desc), 'type = ' + v.type];
    if (v.def !== undefined) items.push('default = ' + hv(v.def));
    if (v.val) items.push('', B('validation', ['condition = ' + v.val.condition, 'error_message = ' + hq(v.val.error)]));
    varsTxt += R(`variable "${name}"`, items) + '\n\n';
  }
  files.push({ name: 'variables.tf', cat: 'root', content: tidy(varsTxt) });

  // data.tf (shared data sources)
  if (data.size) files.push({ name: 'data.tf', cat: 'root', content: tidy(header('data.tf', ['Shared data sources: read-only lookups used by several services.']) + [...data.values()].join('\n\n')) });

  // service files
  for (const f of svcFiles) {
    const s = f.svc;
    const links = s.res.map(t => '  ' + t + ': ' + docUrl(t));
    const name = (g.layout === 'category' ? s.cat + '_' : '') + s.file + '.tf';
    files.push({ name, cat: s.cat, svc: s.id, content: tidy(header(`${s.name}`, [s.desc, 'Registry docs:', ...links]) + f.body) });
  }

  // outputs.tf
  let outTxt = header('outputs.tf', ['Values printed after apply and readable by other configurations.']);
  lastSvc = null;
  for (const [name, o] of outs) {
    if (o.svc !== lastSvc) { outTxt += (lastSvc ? '\n' : '') + '# ' + SVC[o.svc].name + '\n\n'; lastSvc = o.svc; }
    outTxt += R(`output "${name}"`, ['description = ' + hq(o.desc), 'value = ' + o.value]) + '\n\n';
  }
  if (!outs.size) outTxt += '# Select services to generate outputs.\n';
  files.push({ name: 'outputs.tf', cat: 'root', content: tidy(outTxt) });

  // terraform.tfvars.example
  let tfv = '# Copy to terraform.tfvars and adjust. Never put credentials or passwords here.\n\n';
  for (const [name, v] of vars) {
    if (v.def === undefined) tfv += `${name} = "REPLACE_ME" # required\n`;
    else tfv += `# ${name} = ${hv(v.def).split('\n').join('\n# ')}\n`;
  }
  files.push({ name: 'terraform.tfvars.example', cat: 'root', content: tfv });

  // order: providers, locals, variables, data, services, outputs, tfvars
  const extras = Object.entries(extraFiles).map(([name, content]) => ({ name, content, cat: 'extra' }));
  return { files, extras, notes, vars, outs, flags };
}

/* ---------- static validation ---------- */
function stripComments(t) {
  // Remove comments while preserving strings (so '#' inside strings survives).
  let out = '', i = 0, inStr = false;
  while (i < t.length) {
    const ch = t[i];
    if (inStr) { out += ch; if (ch === '\\') { out += t[i + 1] || ''; i += 2; continue; } if (ch === '"') inStr = false; i++; continue; }

    if (ch === '#' || (ch === '/' && t[i + 1] === '/')) { while (i < t.length && t[i] !== '\n') i++; continue; }
    if (ch === '/' && t[i + 1] === '*') { const e = t.indexOf('*/', i + 2); i = e < 0 ? t.length : e + 2; continue; }

}
function balance(t) {

    const ch = t[i];
